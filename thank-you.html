<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta http-equiv="Content-Security-Policy"
      content="default-src 'self';
               script-src 'self' 'unsafe-inline';
               style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
               font-src https://fonts.gstatic.com;
               img-src 'self' data: https:;
               object-src 'none';
               base-uri 'self';
               form-action 'self';">
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()">

<title>Thank You | NextGen Skills Foundation</title>
<meta name="description" content="Thank you for reaching out to NextGen Skills Foundation. We'll be in touch soon.">
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://[CLIENT-DOMAIN]/thank-you.html">
<meta name="theme-color" content="#0A2A45">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"></noscript>

<style>
  :root{ --navy:#0A2A45; --green-deep:#027A2E; --ink-soft:#4B5866; --paper:#FBFCFD; --line:#DFE7E2; }
  *{box-sizing:border-box;}
  body{ margin:0; font-family:'Inter',sans-serif; background:var(--paper); color:var(--ink-soft); }
  .skip-link{ position:absolute; top:-100%; left:1rem; background:var(--navy); color:#fff; padding:.65rem 1.1rem; border-radius:0 0 8px 8px; z-index:9999; font-weight:600; text-decoration:none; }
  .skip-link:focus{ top:0; }
  main{ min-height:100vh; display:flex; align-items:center; justify-content:center; text-align:center; padding:24px; }
  .card{ max-width:480px; }
  .check{ width:64px; height:64px; margin:0 auto 22px; }
  h1{ font-family:'Fraunces',serif; color:var(--navy); font-size:1.8rem; margin:0 0 12px; }
  p{ font-size:16px; line-height:1.6; margin:0 0 28px; }
  a.btn{ display:inline-flex; align-items:center; gap:8px; background:var(--green-deep); color:#fff; text-decoration:none;
         font-weight:600; padding:14px 26px; border-radius:100px; }
  a.btn:focus-visible{ outline:3px solid var(--navy); outline-offset:3px; }
</style>
</head>
<body>

<a href="#main" class="skip-link">Skip to main content</a>

<main id="main" role="main">
  <div class="card">
    <svg class="check" viewBox="0 0 64 64" fill="none" aria-hidden="true">
      <circle cx="32" cy="32" r="30" fill="#E6F7EA" stroke="#027A2E" stroke-width="2"/>
      <path d="M20 33L27.5 40.5L44 23" stroke="#027A2E" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <h1>Thank you — we've got your message.</h1>
    <p>Someone from NextGen Skills Foundation will follow up by email as soon as possible. In the meantime,
    feel free to explore more about our programmes.</p>
    <a class="btn" href="/">&larr; Back to the homepage</a>
  </div>
</main>

</body>
</html>
